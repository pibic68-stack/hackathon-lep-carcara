<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bloco 4: a virada</title>
<link rel="stylesheet" href="/web/css/tokens.css">
<link rel="stylesheet" href="/web/css/ficha.css">
<link rel="stylesheet" href="comum.css">
<style>
  /* tudo na grade da logo: 1 pixel da logo = U px na tela */
  #arte { position: absolute; left: 0; top: 0; width: 1920px; height: 890px; shape-rendering: crispEdges; }
  .cresce { animation: cresce .9s linear both; }
  @keyframes cresce { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  #ficha-mov { position: absolute; left: 60px; top: 300px; width: 256px; height: 340px; transform-origin: center; animation: entra-prisma 1.1s cubic-bezier(.5,0,.8,.4) both; }
  #ficha { width: 610px; transform: scale(.42); transform-origin: top left; }
  @keyframes entra-prisma { from { transform: none; opacity: 1; } 80% { opacity: 1; } to { transform: translate(560px, -10px) scale(.15); opacity: 0; } }
  .versao { position: absolute; font-size: 34px; font-weight: 700; display: flex; align-items: center; gap: 14px; }
  .versao i { width: 26px; height: 26px; display: inline-block; border: 3px solid var(--tinta); }
  #pergunta { position: absolute; left: 0; right: 0; top: 30px; text-align: center; font-size: 76px; }
  #todos { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font-size: 96px; color: var(--ceu-escuro); }
</style>
</head>
<body>
<div class="palco">
  <div id="pergunta" class="titulo entra" data-f="@0.2">uma aula entra…</div>
  <svg id="arte" viewBox="0 0 1920 890"></svg>
  <div id="ficha-mov" data-f="@1.0"><div id="ficha"></div></div>
  <div id="rotulos"></div>
  <div id="todos" class="titulo surge" data-f="1">para todos</div>
</div>
<script src="/web/js/dados.js"></script>
<script src="/web/js/icones.js"></script>
<script src="/web/js/material.js"></script>
<script src="motor.js"></script>
<script>
  window.BLOCO = 4; window.SOBRA = 1.0;
  var U = 16, X0 = 560, Y0 = 290;          // tamanho do pixel e canto da logo na tela
  var NOMES = { "#E5533D": "original", "#FFAD60": "leitura fácil", "#FFC93C": "ouvir",
                "#7BD389": "cores seguras", "#57B3F9": "letra grande", "#B89AF0": "página calma" };
  var ORDEM = ["#E5533D", "#FFAD60", "#FFC93C", "#7BD389", "#57B3F9", "#B89AF0"];
  var CINZA = "#8A8FA8", FIM_X = 58;       // os raios terminam na coluna 58 da grade (x = 1488 px)

  function px(g, x, y, w, h, cor) {
    var r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    r.setAttribute("x", X0 + x * U); r.setAttribute("y", Y0 + y * U);
    r.setAttribute("width", w * U); r.setAttribute("height", h * U); r.setAttribute("fill", cor);
    g.appendChild(r);
  }
  function grupo(svg, cls, atraso) {
    var g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    if (cls) { g.setAttribute("class", cls); g.style.animationDelay = atraso + "s"; }
    svg.appendChild(g); return g;
  }

  window.montar = function () {
    document.getElementById("ficha").innerHTML = Prisma.ficha("original");
    var texto = window.LOGO_SVG, svg = document.getElementById("arte");
    var pix = [], re = /<rect x="(\d+)" y="(\d+)" width="1" height="1" fill="(#\w+)"\/>/g, m;
    while ((m = re.exec(texto))) pix.push({ x: +m[1], y: +m[2], c: m[3] });

    // feixe cinza que entra: continua as duas linhas cinza da logo até a borda esquerda
    var gc = grupo(svg, "cresce", 0.8);
    px(gc, -X0 / U, 10, X0 / U, 2, CINZA);

    // raios de saída: cada cor continua do último pixel dela na logo, em degraus, até o rótulo
    var alvos = {}, r = document.getElementById("rotulos");
    ORDEM.forEach(function (cor, i) {
      var meus = pix.filter(function (p) { return p.c === cor; });
      var xmax = Math.max.apply(null, meus.map(function (p) { return p.x; }));
      var ys = meus.filter(function (p) { return p.x === xmax; }).map(function (p) { return p.y; });
      var y0 = ys.reduce(function (a, b) { return a + b; }, 0) / ys.length;
      var y1 = -8 + i * 7.6;               // linha de chegada de cada raio (em pixels da logo)
      var g = grupo(svg, "cresce", 2.0 + i * 0.1);
      var anterior = Math.round(y0);
      for (var x = xmax + 1; x <= FIM_X; x++) {
        var t = (x - xmax) / (FIM_X - xmax);
        var y = Math.round(y0 + (y1 - y0) * t);
        var de = Math.min(y, anterior), ate = Math.max(y, anterior);
        px(g, x, de, 1, ate - de + 1, cor);   // sem buracos quando o raio sobe ou desce rápido
        anterior = y;
      }
      var d = document.createElement("div");
      d.className = "versao entra";
      d.style.left = (X0 + (FIM_X + 1.6) * U) + "px";
      d.style.top = (Y0 + y1 * U - 18) + "px";
      d.style.animationDelay = (2.7 + i * 0.1) + "s";
      d.innerHTML = '<i style="background:' + cor + '"></i>' + NOMES[cor];
      r.appendChild(d);
    });

    // a logo por cima, pixel por pixel (mesma grade)
    var gl = grupo(svg, "surge", 0.4);
    gl.style.transformOrigin = (X0 + 15 * U) + "px " + (Y0 + 9 * U) + "px";
    pix.forEach(function (p) { px(gl, p.x, p.y, 1, 1, p.c); });
  };
</script>
<script>
  // a logo é lida do arquivo do site (síncrono, antes do motor montar a cena)
  (function () {
    var x = new XMLHttpRequest();
    x.open("GET", "/web/assets/img/prisma-logo.svg", false); x.send();
    window.LOGO_SVG = x.responseText;
  })();
</script>
</body>
</html>
